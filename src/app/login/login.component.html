<div class="login-container">
  <div class="login-card">
    <!-- BRAND HEADER -->
    <div class="login-header">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h1 class="brand-name">PrestaFlow</h1>
      <p class="login-subtitle">Ingresa al panel de control de cartera y cobranza</p>
    </div>

    <!-- ERROR MESSAGES -->
    @if (errorMessage()) {
      <div class="error-banner">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="error-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span class="error-text">{{ errorMessage() }}</span>
      </div>
    }

    <!-- LOGIN FORM -->
    <form (submit)="$event.preventDefault(); onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Nombre de Usuario</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="Ej. admin"
            [value]="username()"
            (input)="username.set($any($event.target).value)"
            required
            autocomplete="username"
            [disabled]="isLoading()"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            required
            autocomplete="current-password"
            [disabled]="isLoading()"
          />
        </div>
      </div>

      <button type="submit" class="btn btn-login" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
          Ingresando...
        } @else {
          Ingresar al Sistema
        }
      </button>
    </form>
  </div>
  
  <div class="login-footer">
    <span>PrestaFlow v1.0.0 &copy; 2026</span>
  </div>
</div>
